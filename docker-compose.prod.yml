# ============================================================
#   Production on one server: Caddy (HTTPS) → API, worker, three web apps, Postgres, Redis.
#   Images come from GitHub's registry (built by CI on main), tagged by git commit.
#
#     cp .env.production.example .env      # fill it in (see DEPLOYMENT.md)
#     docker compose -f docker-compose.prod.yml pull
#     docker compose -f docker-compose.prod.yml up -d
#
#   Migrations run in the one-off "migrate" service before the API starts; a failed
#   migration stops the deploy. Product images and backups go to S3-compatible storage.
# ============================================================
name: ecom

x-logging: &logging
  # Rotated, so logs can't fill the disk.
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-api-image: &api-image
  image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/ecom-api:${IMAGE_TAG:-latest}
  env_file: ${ENV_FILE:-.env}
  logging: *logging
  networks: [ecom]

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: ${ENV_FILE:-.env}
    depends_on: [api, storefront, store-admin, super-admin]
    logging: *logging
    networks: [ecom]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ecom_platform}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom} -d ${POSTGRES_DB:-ecom_platform}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    networks: [ecom]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only file: queued emails and jobs survive a restart.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging
    networks: [ecom]

  migrate:
    <<: *api-image
    restart: "no"
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *api-image
    restart: unless-stopped
    # Node uses one core per process: one copy per core (the load test in DEPLOYMENT.md).
    deploy:
      replicas: ${API_REPLICAS:-2}
    environment:
      NODE_ENV: production
      # The worker service sends emails and runs the background jobs.
      EMAIL_WORKER: "off"
      # Order numbers and "today" use the shop's day, not UTC (the image sets it too).
      TZ: Asia/Dhaka
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *api-image
    restart: unless-stopped
    command: ["./node_modules/.bin/tsx", "src/workers/index.ts"]
    environment:
      NODE_ENV: production
      TZ: Asia/Dhaka
    # No web port, so the image's API health check doesn't apply.
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Nightly database backup at 02:30: kept in the backups volume, copied to BACKUP_S3_BUCKET.
  backup:
    <<: *api-image
    restart: unless-stopped
    command: ["./node_modules/.bin/tsx", "scripts/backup.ts", "--daemon"]
    environment:
      NODE_ENV: production
      TZ: Asia/Dhaka
      BACKUP_DIR: /backups
    volumes: [backups:/backups]
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  storefront:
    image: ghcr.io/${GHCR_OWNER}/ecom-storefront:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Server-side requests go straight to the API container.
      API_INTERNAL_URL: http://api:4000/api
      STOREFRONT_ORIGIN: https://${SHOP_DOMAIN:?set SHOP_DOMAIN in .env}
      SENTRY_DSN: ${SENTRY_DSN:-}
      IMAGE_TAG: ${IMAGE_TAG:-latest}
    depends_on: [api]
    logging: *logging
    networks: [ecom]

  store-admin:
    image: ghcr.io/${GHCR_OWNER}/ecom-store-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      IMAGE_TAG: ${IMAGE_TAG:-latest}
    depends_on: [api]
    logging: *logging
    networks: [ecom]

  super-admin:
    image: ghcr.io/${GHCR_OWNER}/ecom-super-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      IMAGE_TAG: ${IMAGE_TAG:-latest}
    depends_on: [api]
    logging: *logging
    networks: [ecom]

volumes:
  pgdata:
  backups:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  ecom:
