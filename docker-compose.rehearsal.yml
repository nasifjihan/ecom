# ============================================================
#   LOCAL REHEARSAL of the production setup only. Never use on a server.
#   Adds Mailpit (mail catcher; files use the API's local disk, STORAGE_DRIVER=local), and lets the API accept the
#   *.ecom.localhost addresses (PRODUCTION_REHEARSAL=on). Run under its own project name so
#   it never touches the dev database:
#     docker compose -p ecom-rehearsal --env-file .env.rehearsal \
#       -f docker-compose.prod.yml -f docker-compose.rehearsal.yml up -d
# ============================================================
x-rehearsal: &rehearsal
  environment:
    NODE_ENV: production
    PRODUCTION_REHEARSAL: "on"

services:
  migrate: *rehearsal
  api:
    environment:
      NODE_ENV: production
      PRODUCTION_REHEARSAL: "on"
      EMAIL_WORKER: "off"
  worker: *rehearsal
  # Query statistics for the load test (Batch 46 part 4): which queries are slowest.
  postgres:
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
  backup: *rehearsal

  # S3-compatible stand-in for the backup bucket (MinIO no longer publishes free images).
  s3:
    image: adobe/s3mock:3.12.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ecom-backups
    networks: [ecom]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8026:8025"]
    networks: [ecom]

