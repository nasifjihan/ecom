# ============================================================
# E-Commerce Platform — Local Development Infrastructure
# Start before running API:
#   docker compose up -d postgres redis minio mailpit
# Full stack with apps (after Dockerfiles exist):
#   docker compose --profile all up -d
# ============================================================
name: ecom-platform

services:
  # ============== POSTGRESQL ==============
  postgres:
    image: postgres:17-alpine
    container_name: ecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecom_platform
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom_local_pw
      TZ: Asia/Dhaka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom_platform || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecom-net

  # ============== REDIS (caching + BullMQ queues) ==============
  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - ecom-net

  # ============== MinIO (S3-compatible object storage) ==============
  # Web UI:   http://localhost:9001  (minioadmin / minioadmin123)
  # S3 endpoint for apps: http://localhost:9000
  minio:
    image: minio/minio:latest
    container_name: ecom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecom-net

  # ============== Mailpit (catches ALL dev emails — no real email sent) ==============
  # SMTP port:       1025 (use in .env SMTP_HOST=localhost SMTP_PORT=1025)
  # Web Inbox UI:    http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecom-mailpit
    restart: unless-stopped
    environment:
      TZ: Asia/Dhaka
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-qO-", "http://localhost:8025/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - ecom-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

networks:
  ecom-net:
    driver: bridge
