# ============================================================
# E-Commerce Platform — Docker Compose
#
# Everyday development (apps run with `pnpm dev`, only infrastructure in Docker):
#   docker compose up -d postgres redis minio mailpit
#
# Everything in Docker (API + storefront + store admin + super admin):
#   docker compose --profile full up -d --build
#   (add --profile extras for MinIO file storage and the Mailpit inbox)
#   docker compose --profile full run --rm api pnpm prisma:seed   # first run only: demo data
#   Storefront http://localhost:3000 · Store admin http://localhost:3001
#   Super admin http://localhost:3002 · API http://localhost:4000
#
# Secrets (JWT_*, COOKIE_SECRET, APP_ENCRYPTION_KEY, ...) come from the root .env.
# Host names inside the network (postgres, redis, minio, mailpit) are set below.
# ============================================================
name: ecom-platform

services:
  # ============== POSTGRESQL ==============
  postgres:
    image: postgres:17-alpine
    container_name: ecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecom_platform
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom_local_pw
      TZ: Asia/Dhaka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom_platform || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ecom-net

  # ============== REDIS (caching + BullMQ queues) ==============
  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - ecom-net

  # ============== MinIO (S3-compatible object storage) ==============
  # Web UI:   http://localhost:9001  (minioadmin / minioadmin123)
  # S3 endpoint for apps: http://localhost:9000
  minio:
    image: minio/minio:latest
    container_name: ecom-minio
    profiles: ["extras"] # started when named, or with --profile extras
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecom-net

  # ============== Mailpit (catches ALL dev emails — no real email sent) ==============
  # SMTP port:       1025 (use in .env SMTP_HOST=localhost SMTP_PORT=1025)
  # Web Inbox UI:    http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecom-mailpit
    profiles: ["extras"] # started when named, or with --profile extras
    restart: unless-stopped
    environment:
      TZ: Asia/Dhaka
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-qO-", "http://localhost:8025/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - ecom-net

  # ============== APPLICATIONS (profile: full) ==============
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ecom/api:local
    container_name: ecom-api
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://ecom:ecom_local_pw@postgres:5432/ecom_platform?schema=public
      DIRECT_URL: postgresql://ecom:ecom_local_pw@postgres:5432/ecom_platform?schema=public
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/ecom-local
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecom-net

  storefront:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: storefront-fashion
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    image: ecom/storefront-fashion:local
    container_name: ecom-storefront
    restart: unless-stopped
    init: true
    environment:
      # Server-side fetches go straight to the API container but still name the
      # storefront's own origin, which the API uses to pick the store.
      API_INTERNAL_URL: http://api:4000/api
      STOREFRONT_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ecom-net

  store-admin:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: store-admin
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
    image: ecom/store-admin:local
    container_name: ecom-store-admin
    restart: unless-stopped
    init: true
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ecom-net

  super-admin:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP: super-admin
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
    image: ecom/super-admin:local
    container_name: ecom-super-admin
    restart: unless-stopped
    init: true
    ports:
      - "3002:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ecom-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

networks:
  ecom-net:
    driver: bridge
