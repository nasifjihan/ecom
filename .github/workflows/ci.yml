name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # Required: the API and shared packages must typecheck, build and pass tests
  # (including DB-backed tests against a real Postgres).
  api:
    name: API & packages (typecheck, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ecom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/ecom_test?schema=public
      DIRECT_URL: postgresql://postgres:test@localhost:5432/ecom_test?schema=public
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Apply database schema
        working-directory: apps/api
        # Use migrations once they exist; until the init migration lands, sync the schema directly.
        run: |
          if [ -d prisma/migrations ]; then
            pnpm exec prisma migrate deploy
          else
            pnpm exec prisma db push --skip-generate
          fi
      - run: pnpm turbo run typecheck build test --filter=@ecom/api --filter='./packages/*'

  # Informational until the existing errors are fixed: these run and report
  # (as a warning annotation and in the job summary) but stay green so they do
  # not block merging. Remove the continue-on-error on the step and the
  # "Report" step to make them required.
  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - id: check
        continue-on-error: true
        run: pnpm turbo run lint --continue
      - name: Report
        if: steps.check.outcome == 'failure'
        run: |
          echo "::warning title=Lint (non-blocking)::Lint has existing errors; see the lint step log."
          echo "Lint failed (non-blocking). See the lint step log for details." >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend apps (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: check
        continue-on-error: true
        run: pnpm turbo run typecheck build test --continue --filter='./apps/*' --filter='!@ecom/api'
      - name: Report
        if: steps.check.outcome == 'failure'
        run: |
          echo "::warning title=Frontend apps (non-blocking)::Frontend typecheck/build/test has existing failures; see the step log."
          echo "Frontend typecheck/build/test failed (non-blocking). See the step log for details." >> "$GITHUB_STEP_SUMMARY"

  # The production images. Pull requests only build them (a broken Dockerfile fails here);
  # main also pushes them to GitHub's registry, tagged with the commit and "latest".
  # The web apps bake their public addresses in at build time: set them as repository
  # variables (Settings → Secrets and variables → Actions → Variables), see DEPLOYMENT.md.
  images:
    name: Docker images
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ecom-api
            dockerfile: apps/api/Dockerfile
            app: ""
          - name: ecom-storefront
            dockerfile: docker/web.Dockerfile
            app: storefront-fashion
          - name: ecom-store-admin
            dockerfile: docker/web.Dockerfile
            app: store-admin
          - name: ecom-super-admin
            dockerfile: docker/web.Dockerfile
            app: super-admin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub's registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "tags=ghcr.io/$owner/${{ matrix.name }}:${GITHUB_SHA::7},ghcr.io/$owner/${{ matrix.name }}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:4000/api' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL || 'http://localhost:3100' }}
            NEXT_PUBLIC_STOREFRONT_URL=${{ vars.PUBLIC_SITE_URL || 'http://localhost:3100' }}
            NEXT_PUBLIC_STORE_ADMIN_URL=${{ vars.PUBLIC_STORE_ADMIN_URL || 'http://localhost:3101/login' }}
